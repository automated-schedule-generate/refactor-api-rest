name: Docker Build & Push

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # só dispara em tags semver, ex: v1.2.3, v1.2.3-beta

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract tag name
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/asgen-api
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/asgen-api:${{ steps.tag.outputs.name }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/asgen-api:${{ steps.tag.outputs.name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Reporta no Security tab sem barrar o push (a imagem já foi
          # publicada acima). Ajuste exit-code para 1 se quiser bloquear
          # releases futuras quando houver CVE crítica.
          exit-code: '0'

      - name: Upload dos resultados do Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
